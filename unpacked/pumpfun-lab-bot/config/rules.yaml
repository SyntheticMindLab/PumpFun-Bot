version: 0.4

# All gate conditions are evaluated independently.
# A token must pass every enabled hard gate.
gates:
  max_market_cap_sol: 250
  min_market_cap_sol: 20
  min_initial_buy_ratio: 0.005
  require_rugcheck: false
  max_rugcheck_score: 35
  min_liquidity_usd: 0
  require_mint_authority_disabled: true
  require_freeze_authority_disabled: true
  allow_degraded_rugcheck: false

scoring:
  weights:
    market_cap: 20
    initial_buy: 20
    rugcheck: 40
    liquidity: 20
  thresholds:
    market_cap_ideal_low: 30
    market_cap_ideal_high: 150
    initial_buy_ratio_ideal: 0.02
    liquidity_ideal_usd: 25000

exits:
  take_profit:
    enabled: true
    ladder:
      - multiple: 1.50
        sell_pct: 0.25
      - multiple: 2.00
        sell_pct: 0.25
      - multiple: 3.00
        sell_pct: 0.25
  trailing:
    enabled: true
    trail_pct: 20
  time_stop:
    enabled: true
    minutes: 30
  reactive:
    enabled: true
    drop_pct: 25
